{% extends "base.html" %}
{% block title %}Register — BattleChess{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="card auth-card">
    <h1>Create account</h1>
    {% if error.is_some() %}<p class="alert alert-error">{{ error.as_ref().unwrap() }}</p>{% endif %}
    <form class="form-stack" method="post" action="/register">
      <label class="field">
        <span class="field-label">Username</span>
        <input name="username" required autocomplete="username">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input name="password" type="password" required autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Create account</button>
    </form>
    <p class="auth-footer">Already registered? <a href="/login">Login</a></p>
  </div>
</div>
{% endblock %}
