{% extends "base.html" %}
{% block title %}Login — BattleChess{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    {% if error.is_some() %}<p class="alert alert-error">{{ error.as_ref().unwrap() }}</p>{% endif %}
    <form class="form-stack" method="post" action="/login">
      <label class="field">
        <span class="field-label">Username</span>
        <input name="username" required autocomplete="username">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Login</button>
    </form>
    <p class="auth-footer">No account? <a href="/register">Create one</a></p>
  </div>
</div>
{% endblock %}
